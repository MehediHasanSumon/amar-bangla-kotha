# ==============================================================================
# SECTION 1 & 8: SECONDARY BEAM HYPOTHESES (SUGGESTION & DICTIONARY ALTERNATIVES)
# Never win Top-1 in pure Character-First mode; never override explicit keys.
# ==============================================================================

# Bidirectional koi/kOI and kou/kOU candidates (Section 1 & Section 8)
[[rule]]
pattern = "oi"
output = "ৈ"
left = "AFTER_CONSONANT_LIKE"
category = "KAR"
priority = 410.0
variant = true

[[rule]]
pattern = "OI"
output = "ই"
left = "AFTER_CONSONANT_LIKE"
category = "INDEPENDENT_VOWEL"
priority = 160.0
variant = true
overrides_explicit = true

[[rule]]
pattern = "ou"
output = "ৌ"
left = "AFTER_CONSONANT_LIKE"
category = "KAR"
priority = 410.0
variant = true

[[rule]]
pattern = "OU"
output = "উ"
left = "AFTER_CONSONANT_LIKE"
category = "INDEPENDENT_VOWEL"
priority = 160.0
variant = true
overrides_explicit = true

