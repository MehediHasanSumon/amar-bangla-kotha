# Special Y / y rules:
# - Capital "Y" forces য় anywhere including word start and after consonants
# - Lowercase "y" at word start -> ইয় (yahoo -> ইয়াহু); য় never starts a word
# - Lowercase "y" after Reph -> য (karryo -> কার্য)
# - Lowercase "y" after consonant -> য-ফলা (bybohar -> ব্যবহার)
# - Lowercase "y" after vowel or separator -> য় (niyom -> নিয়ম, pray -> প্রায়)
[[rule]]
pattern = "Y"
output = "য়"
left = "ANY"
category = "Y_CONSONANT"
priority = 220.0
explicit = true

[[rule]]
