# ==============================================================================
# Amar Bangla Kotha — Avro-Compatible Phonetic Keymap & Rule Table
# File: data/keymap_phonetic.toml
# Authorship: Clean-room authored in-house for Amar Bangla Kotha (GPLv3).
#             Zero copied text or tables from OmicronLab Avro or OpenBangla.
# Normalization: Canonical Unicode NFC (UAX #15):
#   - Two-part kars composed: ো (U+09CB), ৌ (U+09CC)
#   - Nukta consonants decomposed per UAX #15:
#       ড় = ড + ় (U+09A1 U+09BC)
#       ঢ় = ঢ + ় (U+09A2 U+09BC)
#       য় = য + ় (U+09AF U+09BC)
#       জ় = জ + ় (U+099C U+09BC)
#   - Assamese ৰ (U+09F0) and ৱ (U+09F1) are NEVER emitted.
# ==============================================================================

[metadata]
name = "Amar Bangla Kotha Phonetic"
version = "2.0.0"
normalization = "NFC"
stray_backtick = "silent_separator"

# General C1 + U+09CD (্) + C2 phonotactic compatibility table for Bengali.
# Adjacent consonants C1 followed by C2 automatically form C1 + ্ + C2 when C2
# is a valid cluster partner of C1 in standard Bengali orthography.
# Single র ('r') never initiates Reph; Reph is explicitly 'rr' before consonant.
[phonotactics]
"ক" = "কটতনবমযরলষস"
"খ" = "বযর"
"গ" = "গঘদধনবমযরল"
"ঘ" = "নবযর"
"ঙ" = "কখগঘময"
"চ" = "চছঞবয"
"ছ" = "বযর"
"জ" = "জঝঞবযর"
"ঝ" = "বযর"
"ঞ" = "চছজঝয"
"ট" = "টঠবমযর"
"ঠ" = "বযর"
"ড" = "গডঢবযর"
"ঢ" = "বযর"
"ণ" = "টঠডঢণবময"
"ত" = "তথনবমযর"
"থ" = "বযর"
"দ" = "গঘদধবভমযর"
"ধ" = "নবমযর"
"ন" = "টঠডঢতথদধনবমযস"
"প" = "টতনপফবমযরলস"
"ফ" = "টফবযরল"
"ব" = "জদধবভযরল"
"ভ" = "বভযরল"
"ম" = "নপফবভমযরল"
"য" = "বযর"
"র" = ""
"ল" = "কগটডপফবভমযল"
"শ" = "চছতনবমযরল"
"ষ" = "কটঠণপফবময"
"স" = "কখটতথনপফবমযরল"
"হ" = "ণনবমযরল"

# ==============================================================================
# SECTION 2: ACCENT KEY (BACKTICK `) & EXPLICIT ESCAPES
# ==============================================================================

[[rule]]
pattern = "t``"
output = "ৎ"
left = "ANY"
category = "MODIFIER"
priority = 580.0
explicit = true

[[rule]]
pattern = "r``y"
output = "র\u200D\u09CDয"
left = "ANY"
category = "PHALA"
priority = 580.0
explicit = true

[[rule]]
pattern = ".`"
output = "."
left = "ANY"
category = "PUNCTUATION"
priority = 560.0
explicit = true

[[rule]]
pattern = ":`"
output = ":"
left = "ANY"
category = "PUNCTUATION"
