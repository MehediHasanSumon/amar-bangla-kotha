<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <defs>
    <linearGradient id="bgGradBn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006A4E"/>
      <stop offset="100%" stop-color="#004633"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F42A41"/>
      <stop offset="100%" stop-color="#D01B30"/>
    </linearGradient>
  </defs>
  
  <!-- Outer rounded square plate matching mockup radius -->
  <rect x="1" y="1" width="54" height="54" rx="12" fill="url(#bgGradBn)" stroke="#003324" stroke-width="1.5"/>
  
  <!-- Red Sun / Circle in center -->
  <circle cx="28" cy="28" r="16" fill="url(#sunGrad)"/>
  
  <!-- Crisp white Bengali Character 'বা' -->
  <text x="28" y="38" font-family="'Hind Siliguri', 'Kalpurush', 'Noto Sans Bengali', 'SolaimanLipi', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">বা</text>
</svg>
